<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087A43">
  <title>Helpinghands | Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #087A43;
      --green-dark: #075E35;
      --gold: #D9A441;
      --light: #F3F7F4;
      --white: #FFFFFF;
      --dark: #26352C;
      --muted: #718078;
      --border: #E2EAE4;
      --shadow: 0 12px 35px rgba(10, 65, 35, .09);
      --danger: #C34D42;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    button, input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(520px, 100%);
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      color: var(--green);
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
      font-size: 24px;
    }

    .register-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .register-card h3 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .form-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      margin-bottom: 17px;
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      background: #FCFDFC;
      border-radius: 9px;
      padding: 0 13px;
      outline: none;
      color: var(--dark);
      transition: .2s;
    }

    .form-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8,122,67,.09);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 60px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .field-hint {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    .field-status {
      font-size: 12px;
      margin-top: 5px;
    }

    .referral-info {
      display: none;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #F3F7F4;
      font-size: 12px;
      color: var(--dark);
    }

    .referral-info.show {
      display: block;
    }

    .referral-info strong {
      display: block;
      color: var(--green);
      margin-bottom: 4px;
    }

    .terms {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      color: var(--muted);
      margin: 5px 0 20px;
    }

    .terms input {
      margin-top: 4px;
      accent-color: var(--green);
    }

    .terms a {
      color: var(--green);
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 0;
      border-radius: 9px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .submit-btn {
      width: 100%;
      min-height: 49px;
      font-size: 15px;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .login-prompt {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .login-prompt a {
      color: var(--green);
      font-weight: 800;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,30,20,.55);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: min(400px, 100%);
      padding: 30px;
      border-radius: 17px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: modalIn .25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      background: #E8F4EC;
      color: var(--green);
      font-size: 27px;
    }

    .modal-box h3 {
      margin-bottom: 8px;
    }

    .modal-box p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
      overflow-wrap: anywhere;
    }

    @media(max-width: 650px) {
      .register-card {
        padding: 23px 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <a href="#" class="logo">
        <span class="logo-mark">H</span>
        Helpinghands
      </a>
    </div>

    <div class="register-card">
      <h3>Create Your Account</h3>
      <p class="form-subtitle">Fill in your details to get started.</p>

      <form id="registerForm">
        <div class="form-grid">

          <div class="form-group full">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" required autocomplete="username" minlength="4" maxlength="20">
            <span class="field-hint">4–20 characters: letters, numbers and underscores.</span>
            <div class="field-status" id="usernameStatus"></div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 08012345678" required autocomplete="tel">
          </div>

          <div class="form-group full">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Create password" required minlength="8" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
            </div>
            <div class="field-status" id="passwordStatus"></div>
          </div>

          <div class="form-group full">
            <label for="referralCode">Referral Link / Member ID (Optional)</label>
            <input type="text" id="referralCode" placeholder="Enter a member ID if you have one">
            <span class="field-hint">If you opened a member's referral link, this field will be filled automatically.</span>

            <div class="referral-info" id="referralInfo" aria-live="polite"></div>
          </div>

        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>
            I agree to the <a href="#terms-info">Terms and Conditions</a>
            and understand the platform's privacy practices.
          </span>
        </label>

        <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
          Create Account
        </button>

        <p class="login-prompt">
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">✓</div>
      <h3 id="modalTitle">Notification</h3>
      <p id="modalMessage">Message goes here.</p>
      <button class="btn btn-primary" id="modalClose">Continue</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgKw66LXAJkviJdQMRVN254O71LOocGTA",
      authDomain: "helpinghands-91d11.firebaseapp.com",
      projectId: "helpinghands-91d11",
      storageBucket: "helpinghands-91d11.firebasestorage.app",
      messagingSenderId: "402651670418",
      appId: "1:402651670418:web:59900378df2527043c034b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ===== ELEMENTS ===== */
    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const usernameInput = document.getElementById("username");
    const usernameStatus = document.getElementById("usernameStatus");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const passwordStatus = document.getElementById("passwordStatus");
    const referralInput = document.getElementById("referralCode");
    const referralInfo = document.getElementById("referralInfo");

    let validatedInviter = null;
    let referralCheckVersion = 0;

    /* ===== MODAL ===== */
    function showModal(title, message, icon = "✓") {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message;
      document.getElementById("modalIcon").textContent = icon;
      document.getElementById("modal").classList.add("show");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
    }

    document.getElementById("modalClose").addEventListener("click", closeModal);

    document.getElementById("modal").addEventListener("click", (event) => {
      if (event.target.id === "modal") closeModal();
    });

    /* ===== PASSWORD VISIBILITY ===== */
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.target);
        const isHidden = target.type === "password";
        target.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
      });
    });

    /* ===== PASSWORD MATCH ===== */
    function checkPasswords() {
      const password = passwordInput.value;
      const confirm = confirmPasswordInput.value;

      if (!confirm) {
        passwordStatus.textContent = "";
        return false;
      }

      if (password === confirm) {
        passwordStatus.textContent = "Passwords match.";
        passwordStatus.style.color = "var(--green)";
        return true;
      }

      passwordStatus.textContent = "Passwords do not match.";
      passwordStatus.style.color = "var(--danger)";
      return false;
    }

    passwordInput.addEventListener("input", checkPasswords);
    confirmPasswordInput.addEventListener("input", checkPasswords);

    /* ===== USERNAME FORMAT ===== */
    function validUsername(username) {
      return /^[a-zA-Z0-9_]{4,20}$/.test(username);
    }

    usernameInput.addEventListener("input", () => {
      const username = usernameInput.value.trim().toLowerCase();

      if (!username) {
        usernameStatus.textContent = "";
        return;
      }

      if (validUsername(username)) {
        usernameStatus.textContent = "Username format is valid.";
        usernameStatus.style.color = "var(--green)";
      } else {
        usernameStatus.textContent =
          "Use 4–20 letters, numbers or underscores.";
        usernameStatus.style.color = "var(--danger)";
      }
    });

    /* ===== USERNAME AVAILABILITY ===== */
    async function usernameExists(username) {
      const usernameRef = doc(db, "usernames", username);
      const usernameSnap = await getDoc(usernameRef);
      return usernameSnap.exists();
    }

    /* ===== REFERRAL VALIDATION ===== */
    async function validateReferral(memberUid) {
      if (!memberUid) return null;

      const cleanUid = memberUid.trim();

      if (!cleanUid || cleanUid.length > 128) {
        throw new Error("Please enter a valid member ID.");
      }

      const memberRef = doc(db, "users", cleanUid);
      const memberSnap = await getDoc(memberRef);

      if (!memberSnap.exists()) {
        throw new Error("This referral link is invalid. The member could not be found.");
      }

      const memberData = memberSnap.data();

      if (!memberData.fullName || !memberData.username) {
        throw new Error("The referral member's profile is incomplete.");
      }

      return {
        uid: memberSnap.id,
        fullName: memberData.fullName,
        username: memberData.username
      };
    }

    /* ===== REFERRAL DISPLAY (async-safe) ===== */
    async function checkReferral(memberUid) {
      const version = ++referralCheckVersion;
      validatedInviter = null;

      referralInfo.style.color = "";

      if (!memberUid.trim()) {
        referralInfo.classList.remove("show");
        referralInfo.textContent = "";
        return null;
      }

      referralInfo.classList.add("show");
      referralInfo.textContent = "Verifying referral...";

      try {
        const inviter = await validateReferral(memberUid);

        if (version !== referralCheckVersion) return null;

        validatedInviter = inviter;

        referralInfo.replaceChildren();

        const heading = document.createElement("strong");
        heading.textContent = "Referral verified";

        const details = document.createElement("span");
        details.textContent =
          `Invited by: ${inviter.fullName} (@${inviter.username})`;

        referralInfo.append(heading, details);

        return inviter;

      } catch (error) {
        if (version !== referralCheckVersion) return null;

        referralInfo.textContent = error.message;
        referralInfo.style.color = "var(--danger)";
        return null;
      }
    }

    referralInput.addEventListener("input", () => {
      checkReferral(referralInput.value.trim());
    });

    /* ===== REFERRAL FROM URL ===== */
    const urlParams = new URLSearchParams(window.location.search);
    const referralFromUrl = urlParams.get("ref");

    if (referralFromUrl) {
      referralInput.value = referralFromUrl.trim();
      checkReferral(referralInput.value);
    }

    /* ===== REGISTRATION ===== */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const username = usernameInput.value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const referralCode = referralInput.value.trim();
      const termsAccepted = document.getElementById("terms").checked;

      if (!fullName || !username || !phone || !email) {
        showModal("Missing Information", "Please complete all required fields.", "!");
        return;
      }

      if (!validUsername(username)) {
        showModal("Invalid Username", "Your username must contain 4–20 letters, numbers or underscores.", "!");
        return;
      }

      if (password.length < 8) {
        showModal("Weak Password", "Your password must contain at least 8 characters.", "!");
        return;
      }

      if (password !== confirmPassword) {
        showModal("Password Error", "Your passwords do not match.", "!");
        return;
      }

      if (!termsAccepted) {
        showModal("Terms Required", "Please accept the terms before registering.", "!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";

      try {
        if (await usernameExists(username)) {
          throw new Error("This username is already taken. Please choose another.");
        }

        // Re-validate the referral right before registering (empty is allowed).
        const inviter = referralCode
          ? await validateReferral(referralCode)
          : null;

        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        await updateProfile(user, {
          displayName: fullName
        });

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          fullName,
          username,
          phone,
          email,

          // Optional referral attribution
          referralCode: inviter ? inviter.uid : null,
          inviterUid: inviter ? inviter.uid : null,

          accountType: "member",
          createdAt: serverTimestamp()
        });

        await setDoc(doc(db, "usernames", username), {
          uid: user.uid,
          username,
          createdAt: serverTimestamp()
        });

        showModal(
          "Registration Successful",
          "Your Helpinghands account has been created. You can now log in.",
          "✓"
        );

        form.reset();
        usernameStatus.textContent = "";
        passwordStatus.textContent = "";
        referralInfo.classList.remove("show");
        referralInfo.textContent = "";
        validatedInviter = null;

        document.getElementById("modalClose").onclick = () => {
          closeModal();
          window.location.href = "login.html";
        };

      } catch (error) {
        console.error("Registration error:", error);

        let message = error.message;

        if (error.code === "auth/email-already-in-use") {
          message = "This email address already has an account.";
        } else if (error.code === "auth/weak-password") {
          message = "Please choose a stronger password.";
        } else if (error.code === "auth/invalid-email") {
          message = "Please enter a valid email address.";
        } else if (error.code === "auth/network-request-failed") {
          message = "Network error. Please check your internet connection.";
        } else if (error.code === "permission-denied") {
          message = "Firebase permissions prevented registration. Please check your Firestore rules.";
        }

        showModal("Registration Failed", message, "!");

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
